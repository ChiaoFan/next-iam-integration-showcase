name: "CI/CD Pipeline"

on:
  pull_request:
    branches: ["master", "main"]

jobs:
  unified_quality_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Match your Next.js version

      - name: Install dependencies
        run: npm install

      - name: Run Formatting Check
        run: npm run format:check

      # This runs the SAST (Static Analysis) specifically
      - name: Run Snyk Code test
        run: npx snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  deployment_validation:
    name: "Deployment ${{ matrix.environment }}"
    needs: unified_quality_gate #
    strategy:
      matrix:
        environment: [Staging, Production]
    runs-on: ubuntu-latest
    steps:
      - name: "Zero-Waste Provisioning"
        run: |
          echo "Hiring worker for ${{ matrix.environment }}..."
          sleep 12 # Gives you time to talk
          echo "Deployment to ${{ matrix.environment }} successful. Releasing resources."
